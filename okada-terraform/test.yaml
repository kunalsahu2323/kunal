# Updated Splunk OTel config (0.136) — adds docker_stats, filelog, and service.name tagging.
# Replace environment variables (SPLUNK_* etc.) via /etc/default or systemd env or shell.

extensions:
  headers_setter:
    headers:
      - action: upsert
        key: X-SF-TOKEN
        from_context: X-SF-TOKEN
        default_value: "dTuFCrCQeKpk-_bVUj5jRQ"
  health_check:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:13133"
  http_forwarder:
    ingress:
      endpoint: "${SPLUNK_LISTEN_INTERFACE}:6060"
    egress:
      endpoint: "https://api.us1.signalfx.com"
  smartagent:
    bundleDir: "${SPLUNK_BUNDLE_DIR}"
    collectd:
      configDir: "${SPLUNK_COLLECTD_DIR}"
  zpages:
    expvar:
      enabled: true

receivers:
  fluentforward:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:8006"

  # host-level metrics (keeps default)
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
      memory:
      network:
      load:
      paging:
      processes:

  # Docker/container metrics receiver
  docker_stats:
    collection_interval: 30s

  # filelog to read Docker container logs
  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: end
    include_file_name: false
    include_file_path_resolved: true
    multiline:
      # simple heuristic: a log line starting with non-space is a new entry
      line_start_pattern: '^[^\s]'
    operators:
      - type: json_parser
        # optional: parse timestamp from json body if present
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05Z07:00"
      - type: move
        from: attributes.container_name
        to: resource.container_name
      - type: add_attributes
        attributes:
          service.name: sockshop-demo
          deployment.environment: demo
          log.type: app
          source: docker

  otlp:
    protocols:
      grpc:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:4317"
      http:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:4318"

  jaeger:
    protocols:
      grpc:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:14250"
      thrift_binary:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:6832"
      thrift_compact:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:6831"
      thrift_http:
        endpoint: "${SPLUNK_LISTEN_INTERFACE}:14268"

  prometheus/internal:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: ["0.0.0.0:8888"]
        metric_relabel_configs:
          - source_labels: [ __name__ ]
            regex: 'promhttp_metric_handler_errors.*'
            action: drop
          - source_labels: [ __name__ ]
            regex: 'otelcol_processor_batch_.*'
            action: drop

  smartagent/processlist:
    type: processlist

  signalfx:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:9943"

  zipkin:
    endpoint: "${SPLUNK_LISTEN_INTERFACE}:9411"

  nop: {}

processors:
  batch:
    metadata_keys:
      - X-SF-Token

  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}

  resourcedetection:
    detectors: [gcp, ecs, ec2, azure, system]
    override: true

  # Insert otelcol service mode (existing)
  resource/add_mode:
    attributes:
      - action: insert
        value: "agent"
        key: otelcol.service.mode

  # --- New resource processor to upsert service.name and environment for correlation ---
  resource:
    attributes:
      - action: upsert
        key: service.name
        value: "sockshop-demo"
      - action: upsert
        key: deployment.environment
        value: "demo"
      - action: upsert
        key: service.version
        value: "1.0.0"
      - action: upsert
        key: telemetry.sdk.language
        value: "docker"

exporters:
  # traces to Splunk Observability (APM)
  otlphttp:
    traces_endpoint: "https://ingest.us1.signalfx.com/v2/trace/otlp"
    headers:
      "X-SF-Token": "dTuFCrCQeKpk-_bVUj5jRQ"
    auth:
      authenticator: headers_setter

  # metrics + events to Signalfx (Observability)
  signalfx:
    access_token: "dTuFCrCQeKpk-_bVUj5jRQ"
    api_url: "https://api.us1.signalfx.com"
    ingest_url: "https://ingest.us1.signalfx.com"
    sync_host_metadata: true
    correlation:

  # Entities endpoint (if discovery mode in use)
  otlphttp/entities:
    logs_endpoint: "https://ingest.us1.signalfx.com/v3/event"
    headers:
      "X-SF-Token": "dTuFCrCQeKpk-_bVUj5jRQ"
    auth:
      authenticator: headers_setter

  # Logs -> Splunk Platform via HEC (this is the destination you requested)
  splunk_hec:
    token: "cb3adfe7-e9c2-4e80-99cd-ced20a2d6392"
    endpoint: "https://13.217.233.231:8088/services/collector/event"
    source: "otel"
    sourcetype: "_json"
    profiling_data_enabled: false

  # optional profiling export (keeps default semantics)
  splunk_hec/profiling:
    token: "dTuFCrCQeKpk-_bVUj5jRQ"
    endpoint: "https://ingest.us1.signalfx.com/v1/log"
    log_data_enabled: false

  # Debug exporter
  debug:
    verbosity: detailed

service:
  extensions: [headers_setter, health_check, http_forwarder, zpages, smartagent]
  pipelines:
    traces:
      receivers: [jaeger, otlp, zipkin]
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource        # <- ensures service.name and env are present on traces
      exporters: [otlphttp, signalfx]

    metrics:
      receivers: [hostmetrics, otlp, signalfx, docker_stats]
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource        # <- ensures service.name and env are present on metrics
      exporters: [signalfx]

    metrics/internal:
      receivers: [prometheus/internal]
      processors: [memory_limiter, batch, resourcedetection, resource/add_mode]
      exporters: [signalfx]

    logs/signalfx:
      receivers: [signalfx, smartagent/processlist]
      processors: [memory_limiter, batch, resourcedetection]
      exporters: [signalfx]

    logs/entities:
      # Receivers are dynamically added if discovery mode is enabled
      receivers: [nop]
      processors: [memory_limiter, batch, resourcedetection]
      exporters: [otlphttp/entities]

    # **Main logs pipeline**: includes filelog for Docker container logs
    logs:
      receivers: [fluentforward, otlp, filelog]
      processors:
        - memory_limiter
        - batch
        - resourcedetection
        - resource  # ensure logs have service.name & deployment.environment
      exporters: [splunk_hec, splunk_hec/profiling]
